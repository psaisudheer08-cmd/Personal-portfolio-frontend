<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="10 6"/>

  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#avatarGrad)"/>

  <!-- Shoulders / Body -->
  <path d="M110 320 C110 240, 150 220, 200 220 C250 220, 290 240, 290 320 Z" fill="url(#avatarGrad)"/>

  <!-- Overlay text badge -->
  <rect x="75" y="335" width="250" height="34" rx="17" fill="#1e1b4b" opacity="0.85"/>
  <text x="200" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
    Your Profile Photo (400x400)
  </text>
</svg>
