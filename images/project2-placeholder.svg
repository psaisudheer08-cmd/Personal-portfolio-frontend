  <circle cx="170" cy="140" r="30" fill="url(#accent2)"/>
  <rect x="110" y="195" width="120" height="14" rx="4" fill="#c7d2fe"/>

  <rect x="310" y="80" width="180" height="170" rx="12" fill="#3730a3" stroke="#6366f1" stroke-width="2"/>
