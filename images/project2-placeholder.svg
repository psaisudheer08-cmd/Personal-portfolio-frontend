  <rect x="540" y="80" width="180" height="170" rx="12" fill="#3730a3" stroke="#6366f1" stroke-width="2"/>
  <circle cx="630" cy="140" r="30" fill="url(#accent2)"/>
  <rect x="570" y="195" width="120" height="14" rx="4" fill="#c7d2fe"/>

  <!-- Big Banner Center -->
  <rect x="80" y="290" width="640" height="110" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
