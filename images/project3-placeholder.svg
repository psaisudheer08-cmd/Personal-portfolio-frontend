<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="proj3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#proj3Grad)"/>
  
  <!-- Window Header Bar -->
  <rect width="800" height="48" rx="16" fill="#065f46"/>
  <rect y="36" width="800" height="12" fill="#065f46"/>
  
  <!-- Window Control Dots -->
  <circle cx="30" cy="24" r="7" fill="#f87171"/>
  <circle cx="54" cy="24" r="7" fill="#fbbf24"/>
  <circle cx="78" cy="24" r="7" fill="#34d399"/>
  
  <!-- URL Bar -->
  <rect x="120" y="14" width="560" height="20" rx="6" fill="#044e39"/>
  <text x="400" y="28" font-family="system-ui, monospace" font-size="11" fill="#a7f3d0" text-anchor="middle">
    https://yourportfolio.dev/projects/c-calculator
  </text>

  <!-- Terminal / Code Representation -->
  <rect x="80" y="80" width="640" height="180" rx="10" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="125" font-family="monospace" font-size="14" fill="#34d399">$ ./scientific_calc</text>
  <text x="110" y="155" font-family="monospace" font-size="14" fill="#a7f3d0">--- Scientific Calculator in C ---</text>
  <text x="110" y="185" font-family="monospace" font-size="14" fill="#6ee7b7">Enter expression: sin(45) * sqrt(16)</text>
  <text x="110" y="215" font-family="monospace" font-size="14" fill="#fef08a">Result = 2.828427 [SUCCESS]</text>

  <!-- Big Banner Center -->
  <rect x="80" y="290" width="640" height="110" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Project 3 Preview Placeholder
  </text>
  <text x="400" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">
    Replace with your project screenshot (800 x 450 px)
  </text>
